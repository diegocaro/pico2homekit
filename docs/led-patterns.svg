<svg xmlns="http://www.w3.org/2000/svg" width="520" height="216" viewBox="0 0 520 216" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Pico LED patterns</title>
  <desc>Animated: fast blink means not ready yet, a short blink every 5 seconds means all good, a double blink every 2 seconds means a config error, and very fast blinking for 3 seconds means Identify.</desc>
  <rect x="0.5" y="0.5" width="519" height="215" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <g transform="translate(36,40)">
    <circle r="13" fill="#d0d7de" stroke="#8c959f">
      <animate attributeName="fill" dur="0.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="#3fb950;#d0d7de"/>
    </circle>
    <text x="30" y="-2" font-size="15" fill="#1f2328">Fast blink</text>
    <text x="30" y="15" font-size="13" fill="#57606a">Not ready yet: joining Wi-Fi, or waiting to be added in Home</text>
  </g>

  <g transform="translate(36,88)">
    <circle r="13" fill="#d0d7de" stroke="#8c959f">
      <animate attributeName="fill" dur="5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.03" values="#3fb950;#d0d7de"/>
    </circle>
    <text x="30" y="-2" font-size="15" fill="#1f2328">Short blink every 5 seconds</text>
    <text x="30" y="15" font-size="13" fill="#57606a">All good (heartbeat). If it stops, the Pico is stuck</text>
  </g>

  <g transform="translate(36,136)">
    <circle r="13" fill="#d0d7de" stroke="#8c959f">
      <animate attributeName="fill" dur="2s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.075;0.15;0.225" values="#3fb950;#d0d7de;#3fb950;#d0d7de"/>
    </circle>
    <text x="30" y="-2" font-size="15" fill="#1f2328">Double blink every 2 seconds</text>
    <text x="30" y="15" font-size="13" fill="#57606a">Error in config/config.h: make log says what to fix</text>
  </g>

  <g transform="translate(36,184)">
    <circle r="13" fill="#d0d7de" stroke="#8c959f">
      <animate attributeName="fill" dur="0.16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="#3fb950;#d0d7de"/>
    </circle>
    <text x="30" y="-2" font-size="15" fill="#1f2328">Very fast blinking, 3 seconds</text>
    <text x="30" y="15" font-size="13" fill="#57606a">Identify, right after you tap it in the Home app</text>
  </g>
</svg>
